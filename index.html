function playerStrength(p){
  const wins=Number(p.wins)||0;
  const losses=Number(p.losses)||0;
  const games=wins+losses;
  const winRate=games?wins/games:0;
  const scoreTotal=Number(p.scoreTotal)||0;
  return wins*100 + winRate*20 + scoreTotal*0.5;
}

function makeBalancedTeams(players){
  const n=players.length;
  if(n<3){
    // 2人以下の場合だけは従来どおり2チーム。
    const ids=players.map(p=>p.id).sort(()=>Math.random()-.5);
    return [ids.filter((_,i)=>i%2===0),ids.filter((_,i)=>i%2===1)];
  }

  const q=Math.floor(n/3), r=n%3;
  // できるだけ均等：11人なら4:4:3。
  const sizes=[q+(r>0?1:0),q+(r>1?1:0),q];

  const strengths=players.map(playerStrength);
  const total=strengths.reduce((a,b)=>a+b,0);
  const candidates=[];

  function addCandidate(a,b,c){
    const sums=[
      a.reduce((s,i)=>s+strengths[i],0),
      b.reduce((s,i)=>s+strengths[i],0),
      c.reduce((s,i)=>s+strengths[i],0)
    ];
    const max=Math.max(...sums), min=Math.min(...sums);
    const mean=total/3;
    const diff=max-min;
    const variance=sums.reduce((s,x)=>s+(x-mean)**2,0);
    candidates.push({a,b,c,diff,variance});
  }

  if(n<=12){
    // 11人程度なら全候補を調べて、最もバランスの良い組み合わせを探す。
    const indices=[...Array(n).keys()];
    const choose=(arr,k,start=0,picked=[],cb)=>{
      if(picked.length===k){cb(picked);return;}
      for(let i=start;i<=arr.length-(k-picked.length);i++){
        choose(arr,k,i+1,[...picked,arr[i]],cb);
      }
    };

    // チーム1に0番目を固定して、同じ組み合わせの重複を減らす。
    const rest=indices.slice(1);
    choose(rest,sizes[0]-1,0,[],team1Pick=>{
      const set1=new Set([0,...team1Pick]);
      const remaining=indices.filter(i=>!set1.has(i));
      choose(remaining,sizes[1],0,[],team2Pick=>{
        const set2=new Set(team2Pick);
        const team3=remaining.filter(i=>!set2.has(i));
        addCandidate([0,...team1Pick],team2Pick,team3);
      });
    });
  }else{
    // 大人数では500通りのランダム候補からバランスの良いものを選ぶ。
    for(let t=0;t<500;t++){
      const order=players.map((_,i)=>i).sort(()=>Math.random()-.5);
      const a=order.slice(0,sizes[0]);
      const b=order.slice(sizes[0],sizes[0]+sizes[1]);
      const c=order.slice(sizes[0]+sizes[1]);
      addCandidate(a,b,c);
    }
  }

  candidates.sort((x,y)=>
    x.diff-y.diff || x.variance-y.variance
  );

  // 最適解だけに固定せず、上位候補からランダムに選ぶ。
  const poolSize=Math.max(1,Math.min(20,Math.ceil(candidates.length*0.1)));
  const chosen=candidates[Math.floor(Math.random()*poolSize)];
  const shuffle=a=>[...a].sort(()=>Math.random()-.5);

  return [
    shuffle(chosen.a).map(i=>players[i].id),
    shuffle(chosen.b).map(i=>players[i].id),
    shuffle(chosen.c).map(i=>players[i].id)
  ];
}

async function startGame(){
 try{
  if(data.players.length<3){alert("3人以上登録してください");return}
  if(data.activeGame){alert("すでに試合入力中です");return}

  const [team1,team2,team3]=makeBalancedTeams(data.players);

  await updateDoc(doc(db,"tournaments",currentCode),{
    activeGame:{
      team1,team2,team3,createdAt:Date.now(),
      teamScores:{team1:0,team2:0,team3:0},
      turns:[]
    }
  });
 }catch(e){showError(e)}
}

async function recordThrow(playerId){
 try{
  const input=$(`throw-${playerId}`);
  const score=Number(input?.value);
  if(!Number.isFinite(score)||score<0||!Number.isInteger(score)){
    alert("0以上の整数を入力してください"); return;
  }
  const ref=doc(db,"tournaments",currentCode);

  await runTransaction(db,async tx=>{
    const snap=await tx.get(ref);
    if(!snap.exists()) throw new Error("大会データが見つかりません");
    const d=snap.data(), a=d.activeGame;
    if(!a) throw new Error("現在、試合中ではありません");

    const teams=[a.team1||[],a.team2||[],a.team3||[]];
    const teamIndex=teams.findIndex(team=>team.includes(playerId));
    if(teamIndex<0) throw new Error("参加者がチームに見つかりません");
    const team=teamIndex+1;

    const teamScores={team1:0,team2:0,team3:0,...(a.teamScores||{})};
    const before=Number(teamScores[`team${team}`]||0);
    let after=before+score;
    let reset=false;
    if(after>50){after=25;reset=true}

    const player=d.players.find(p=>p.id===playerId);
    if(!player) throw new Error("参加者が見つかりません");

    const nextPlayers=d.players.map(p=>{
      if(p.id!==playerId)return p;
      const total=(Number(p.scoreTotal)||0)+score;
      return {
        ...p,
        scoreTotal:total,
        maxScore:Math.max(Number(p.maxScore)||0,score),
        scoreHistory:[...(p.scoreHistory||[]),{
          game:(d.games||[]).length+1,
          throwNo:(a.turns||[]).length+1,
          score,
          cumulative:total
        }]
      };
    });

    const turn={
      no:(a.turns||[]).length+1,
      date:new Date().toLocaleString("ja-JP"),
      playerId,
      playerName:player.name,
      team,
      score,
      before,
      after,
      reset
    };
    const turns=[...(a.turns||[]),turn];
    teamScores[`team${team}`]=after;

    if(after===50){
      const gameNo=(d.games||[]).length+1;
      const allIds=teams.flat();

      const results=allIds.map(id=>{
        const total=(turns||[])
          .filter(t=>t.playerId===id)
          .reduce((s,t)=>s+(Number(t.score)||0),0);
        const ti=teams.findIndex(teamIds=>teamIds.includes(id));
        return {
          id,
          name:d.players.find(p=>p.id===id)?.name||"",
          team:ti,
          score:total,
          win:ti===teamIndex
        };
      });

      const winnerIds=teams[teamIndex];
      const finalPlayers=nextPlayers.map(p=>{
        const r=results.find(x=>x.id===p.id);
        if(!r)return p;
        const win=winnerIds.includes(p.id);
        const wins=(Number(p.wins)||0)+(win?1:0);
        const losses=(Number(p.losses)||0)+(win?0:1);
        const points=(Number(p.points)||0)+(win?1:0);
        const streak=win?(Number(p.streak)||0)+1:0;
        return {
          ...p,
          wins,losses,points,streak,
          bestStreak:Math.max(Number(p.bestStreak)||0,streak),
          history:[...(p.history||[]),{
            game:gameNo,score:r.score,win,points
          }]
        };
      });

      // 試合終了時はFirestoreで扱いやすい「フラットなデータ」だけを書き込みます。
      // これにより、50点ぴったりのときにFirestoreのデータ形式エラーで止まるのを防ぎます。
      const game={
        gameNo,
        date:new Date().toLocaleString("ja-JP"),
        teams:{
          team1:team1.join(","),
          team2:team2.join(","),
          team3:team3.join(",")
        },
        winnerTeam:teamIndex,
        winnerName:`チーム${team}`,
        totals:[Number(teamScores.team1)||0,Number(teamScores.team2)||0,Number(teamScores.team3)||0],
        results:results.map(r=>({
          id:String(r.id||""),
          name:String(r.name||""),
          team:Number(r.team),
          score:Number(r.score)||0,
          win:Boolean(r.win)
        })),
        turns:turns.map(t=>({
          no:Number(t.no)||0,
          date:String(t.date||""),
          playerId:String(t.playerId||""),
          playerName:String(t.playerName||""),
          team:Number(t.team)||0,
          score:Number(t.score)||0,
          before:Number(t.before)||0,
          after:Number(t.after)||0,
          reset:Boolean(t.reset)
        }))
      };

      tx.update(ref,{
        players:finalPlayers,
        games:[...(d.games||[]),game],
        activeGame:null
      });
    }else{
      tx.update(ref,{
        players:nextPlayers,
        activeGame:{...a,teamScores,turns}
      });
    }
  });

  input.value="";
 }catch(e){showError(e)}
}


async function undoThrow(){
 try{
  const ref=doc(db,"tournaments",currentCode);
  await runTransaction(db,async tx=>{
    const snap=await tx.get(ref);
    if(!snap.exists()) throw new Error("大会データが見つかりません");
    const d=snap.data(), a=d.activeGame;
    if(!a || !(a.turns||[]).length){alert("戻せる投球がありません");return}

    const turns=[...(a.turns||[])];
    const last=turns.pop();
    const teamKey=`team${last.team}`;
    const teamScores={team1:0,team2:0,team3:0,...(a.teamScores||{})};
    teamScores[teamKey]=Number(last.before)||0;

    const players=d.players.map(p=>{
      if(p.id!==last.playerId)return p;
      const total=Math.max(0,(Number(p.scoreTotal)||0)-(Number(last.score)||0));
      const sh=[...(p.scoreHistory||[])];
      sh.pop();
      const maxScore=Math.max(0,...sh.map(x=>Number(x.score)||0));
      return {...p,scoreTotal:total,scoreHistory:sh,maxScore};
    });

    tx.update(ref,{
      players,
      activeGame:{...a,teamScores,turns}
    });
  });
 }catch(e){showError(e)}
}

async function cancelGame(){
 if(!data?.activeGame)return;
 if(!confirm("現在の試合を中止しますか？\nすでに反映した個人得点も元に戻します。"))return;
 try{
  const ref=doc(db,"tournaments",currentCode);
  await runTransaction(db,async tx=>{
    const snap=await tx.get(ref);
    if(!snap.exists()) throw new Error("大会データが見つかりません");
    const d=snap.data(), a=d.activeGame;
    if(!a)return;

    const players=d.players.map(p=>{
      const myTurns=(a.turns||[]).filter(t=>t.playerId===p.id);
      if(!myTurns.length)return p;
      const subtract=myTurns.reduce((s,t)=>s+(Number(t.score)||0),0);
      const sh=[...(p.scoreHistory||[])];
      sh.splice(Math.max(0,sh.length-myTurns.length),myTurns.length);
      const total=Math.max(0,(Number(p.scoreTotal)||0)-subtract);
      const maxScore=Math.max(0,...sh.map(x=>Number(x.score)||0));
      return {...p,scoreTotal:total,scoreHistory:sh,maxScore};
    });
    tx.update(ref,{players,activeGame:null});
  });
 }catch(e){showError(e)}
}

async function undoLast(){
 try{
  if(!data.games.length)return;
  if(!confirm("最後の試合を取り消しますか？\n個人得点・勝敗・勝利ポイントも元に戻ります。"))return;
  const games=data.games.slice(0,-1);
  const players=data.players.map(p=>({
    ...p,wins:0,losses:0,points:0,scoreTotal:0,maxScore:0,streak:0,bestStreak:0,history:[],scoreHistory:[]
  }));

  for(const g of games){
    for(const t of (g.turns||[])){
      const p=players.find(x=>x.id===t.playerId); if(!p)continue;
      const score=Number(t.score)||0;
      p.scoreTotal+=score;
      p.maxScore=Math.max(p.maxScore,score);
      p.scoreHistory.push({
        game:g.gameNo,throwNo:p.scoreHistory.length+1,score,cumulative:p.scoreTotal
      });
    }
    for(const r of (g.results||[])){
      const p=players.find(x=>x.id===r.id); if(!p)continue;
      p.wins+=(r.win?1:0);
      p.losses+=(r.win?0:1);
      p.points+=(r.win?1:0);
      p.streak=r.win?p.streak+1:0;
      p.bestStreak=Math.max(p.bestStreak,p.streak);
      p.history.push({game:g.gameNo,score:r.score,win:r.win,points:p.points});
    }
  }
  await updateDoc(doc(db,"tournaments",currentCode),{players,games,activeGame:null});
 }catch(e){showError(e)}
}

function renderGame(){
  const a=data.activeGame, el=$("game");
  if(!a){
    const last=data.games?.length ? data.games[data.games.length-1] : null;
    const lastMsg=last
      ? `<div class="notice" style="margin-bottom:10px">🏆 <b>第${last.gameNo}試合終了！</b><br>チーム${(last.winnerTeam??0)+1} の勝利です。<br>最終得点：チーム1 ${last.totals?.[0]??50}点 ／ チーム2 ${last.totals?.[1]??50}点 ／ チーム3 ${last.totals?.[2]??50}点</div>`
      : "";
    el.innerHTML=lastMsg+`<div class="notice">
    通常ルール：<b>チーム累計50点で勝利</b>。51点以上になったら25点に戻ります。<br>
    <b>1投ずつ</b>得点を反映します。個人得点は勝敗に関係なく、その人が取った点を毎投累計します。<br>
    3チームに自動振り分けします。人数はできるだけ均等（11人なら4:4:3）です。
    </div>
    <button class="primary" style="width:100%;margin-top:10px" onclick="startGame()">▶️ 次の試合を開始</button>`;
    return;
  }

  const activeTeams=[a.team1||[],a.team2||[],a.team3||[]];
  const ts={team1:0,team2:0,team3:0,...(a.teamScores||{})};
  let html=`<div class="notice">
  <b>🎯 1投ずつ入力してください</b><br>
  入力した選手の「反映」ボタンを押すと、チーム得点と個人累計にすぐ加算されます。<br>
  50点ぴったり＝勝利 ／ 50点超過＝25点に戻る
  </div>`;

  activeTeams.forEach((ids,ti)=>{
    const teamScore=Number(ts[`team${ti+1}`]||0);
    html+=`<div class="team"><h3>チーム${ti+1}　現在 <span class="big" style="font-size:22px">${teamScore}点</span></h3>`;
    ids.forEach(id=>{
      const p=data.players.find(x=>x.id===id);
      html+=`<div class="row" style="margin-top:7px;align-items:center">
        <div><b>${esc(p?.name||"")}</b><div class="muted">個人累計：${Number(p?.scoreTotal)||0}点</div></div>
        <input id="throw-${id}" type="number" min="0" step="1" inputmode="numeric" placeholder="得点" style="max-width:90px">
        <button class="primary" onclick="recordThrow('${id}')">反映</button>
      </div>`;
    });
    html+=`</div>`;
  });

  if((a.turns||[]).length){
    html+=`<div style="margin-top:12px"><b>今回の投球履歴</b>`;
    html+=(a.turns||[]).slice().reverse().map(t=>
      `<div class="history">#${t.no} ${esc(t.playerName)}：<b>+${t.score}点</b>　チーム${t.team} ${t.before}→${t.after}${t.reset?'（50点超過→25点）':''}</div>`
    ).join("");
    html+=`</div>
    <button style="width:100%;margin-top:10px" onclick="undoThrow()">↩️ 直前の入力を戻す</button>`;
  }
  html+=`<button class="danger" style="width:100%;margin-top:10px" onclick="cancelGame()">試合を中止</button>`;
  el.innerHTML=html;
}


function rank(){return [...data.players].sort((a,b)=>(Number(b.points)||0)-(Number(a.points)||0)||(Number(b.scoreTotal)||0)-(Number(a.scoreTotal)||0)||(Number(b.wins)||0)-(Number(a.wins)||0)||(Number(b.maxScore)||0)-(Number(a.maxScore)||0))}
function renderRanking(){
 const a=rank(); if(!a.length){$("ranking").innerHTML='<span class="muted">参加者を登録してください。</span>';return}
 $("ranking").innerHTML=`<div class="notice">🎯 <b>個人得点</b>は、勝敗に関係なく各ターンで取った点を累計しています。⭐はチーム勝利ポイントです。</div><table class="table"><tr><th>順位・名前</th><th>個人累計</th><th>勝</th><th>敗</th><th>勝率</th><th>⭐</th><th>最高得点</th></tr>`+a.map((p,i)=>`<tr><td><b>${i+1}位</b> ${esc(p.name)} ${i===0&&data.games.length?"👑":""}</td><td><b>${Number(p.scoreTotal)||0}</b></td><td>${p.wins}</td><td>${p.losses}</td><td>${((p.wins/(p.wins+p.losses||1))*100).toFixed(0)}%</td><td><b>${p.points}</b></td><td>${p.maxScore}</td></tr>`).join("")+"</table>";
}
function renderResult(){
 if(!data.games.length){$("result").innerHTML='<span class="muted">試合を記録すると表示されます。</span>';return}
 const a=rank(),top=a[0],last=a[a.length-1],mw=Math.max(...a.map(p=>p.wins)),ms=Math.max(...a.map(p=>p.maxScore)),bs=Math.max(...a.map(p=>p.bestStreak));
 $("result").innerHTML=`<div class="center"><div class="muted">現在の優勝者（⭐勝利ポイント最多）</div><div class="big">🏆 ${esc(top.name)}</div><div>${top.points}ポイント / ${top.wins}勝</div></div><hr>
 <div>👑 <b>最多勝</b>：${a.filter(p=>p.wins===mw).map(p=>esc(p.name)).join("、")}（${mw}勝）</div>
 <div>🎯 <b>最高得点</b>：${a.filter(p=>p.maxScore===ms).map(p=>esc(p.name)).join("、")}（${ms}点）</div>
 <div>🔥 <b>最多連勝</b>：${a.filter(p=>p.bestStreak===bs).map(p=>esc(p.name)).join("、")}（${bs}連勝）</div>
 <div style="margin-top:10px;padding:12px;border-radius:12px;background:#f1f1f1">💩 <b>最下位</b><br><span class="big">${esc(last.name)}</span> さん</div>`;
}
function renderHistory(){
  if(!data.games.length){
    $("history").innerHTML='<span class="muted">まだ試合がありません。</span>';
    return;
  }
  $("history").innerHTML=data.games.map(g=>{
    const totals=g.totals||[50,50,50];
    return `<div class="history"><b>第${g.gameNo}試合</b>　${esc(g.date)}<br>
    🏆 <b>チーム${(g.winnerTeam??0)+1} の勝利</b>　
    最終得点：チーム1 ${totals[0]??50}点 ／ チーム2 ${totals[1]??50}点 ／ チーム3 ${totals[2]??50}点<br>
    ${(g.results||[]).map(r=>`<span class="badge">${esc(r.name)}：この試合 ${r.score}点 ${r.win?'🏆 +1':''}</span>`).join(" ")}</div>`;
  }).join("")+`<button class="danger" onclick="undoLast()">↩️ 最後の試合を取り消す</button>`;
}


function drawChart(){
 const c=$("chart"),ctx=c.getContext("2d"),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);
 if(!data.games.length){ctx.font="14px sans-serif";ctx.fillText("試合を記録すると推移が表示されます。",20,40);return}
 const arr=rank(),left=35,bottom=30,top=15,right=90,max=Math.max(1,...arr.map(p=>p.points));
 ctx.strokeStyle="#bbb";ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,h-bottom);ctx.lineTo(w-right,h-bottom);ctx.stroke();
 arr.slice(0,6).forEach((p,idx)=>{ctx.strokeStyle=["#111","#444","#666","#888","#aaa","#ccc"][idx];ctx.lineWidth=2;ctx.beginPath();(p.history||[]).forEach((x,i)=>{const X=left+(i/Math.max(1,data.games.length-1))*(w-left-right),Y=h-bottom-(x.points/max)*(h-bottom-top);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();ctx.fillStyle="#111";ctx.font="12px sans-serif";ctx.fillText(p.name,w-82,22+idx*17)});
}
</script>
