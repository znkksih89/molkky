<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>モルック大会</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#151515;--muted:#777;--line:#ddd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:10}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.7;margin-top:4px}
main{max-width:760px;margin:auto;padding:12px 12px 80px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 12px}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}
input,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}button{font-weight:700;cursor:pointer}.primary{background:#111;color:#fff;border-color:#111}.danger{color:#b00020}.muted{color:var(--muted);font-size:13px}
.notice{padding:10px;border-radius:10px;background:#f0f0f0;font-size:13px}.code{font-size:28px;font-weight:900;letter-spacing:4px;text-align:center;padding:10px;background:#f5f5f5;border-radius:12px}
.players{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 10px;border:1px solid #ddd;border-radius:999px}
.team{border:1px solid #ddd;border-radius:12px;padding:10px;margin-top:10px}.team h3{margin:0 0 8px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 95px;gap:7px;align-items:center}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:8px 5px;border-bottom:1px solid #ddd;text-align:center}.table th:first-child,.table td:first-child{text-align:left}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eee;font-size:11px}.gold{background:#ffe68a}.big{font-size:28px;font-weight:900}.center{text-align:center}.hidden{display:none}
.history{border-left:3px solid #111;padding-left:10px;margin:10px 0}.small{font-size:12px}.topline{display:flex;justify-content:space-between;gap:8px;align-items:center}
canvas{width:100%;height:220px;border:1px solid #ddd;border-radius:10px}
</style>
</head>
<body>
<header><h1>🏆 モルック大会</h1><div class="sub">個人得点 ＋ チーム勝利ポイント　／　リアルタイム共有</div></header>
<main>
<section id="lobby" class="card">
<h2>大会に参加</h2>
<div class="row"><input id="joinCode" maxlength="6" placeholder="大会コード"><button class="primary" onclick="joinTournament()">参加</button></div>
<div style="height:8px"></div>
<div class="row"><input id="newTournamentName" placeholder="大会名（例：8/15モルック大会）"><button onclick="createTournament()">大会を作る</button></div>
<div id="lobbyMsg" class="muted" style="margin-top:9px"></div>
</section>

<section id="tournament" class="hidden">
<section class="card">
<div class="topline"><h2 id="title" style="margin:0">大会</h2><button class="small" onclick="leaveTournament()">退出</button></div>
<div class="muted">大会コード</div><div id="code" class="code"></div>
<div class="muted center">このコードを友達に共有してください</div>
</section>

<section class="card">
<h2>👤 参加者</h2>
<div class="row"><input id="playerName" placeholder="名前を入力"><button class="primary" onclick="addPlayer()">参加者を追加</button></div>
<div id="players" class="players" style="margin-top:10px"></div>
</section>

<section class="card">
<h2>🎯 試合</h2>
<div id="game"></div><div id="error" class="notice hidden" style="margin-top:10px"></div>
</section>

<section class="card">
<h2>📊 ランキング</h2><div id="ranking"></div>
</section>

<section class="card">
<h2>📈 ポイント推移</h2><canvas id="chart" width="700" height="240"></canvas>
</section>

<section class="card">
<h2>🏆 大会結果</h2><div id="result"></div>
</section>

<section class="card">
<h2>🕘 試合履歴</h2><div id="history"></div>
</section>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,runTransaction,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyD5X2FOEcc5G4kWCKLQXHfVfhNSR9mAI2Y",
 authDomain:"molkky-aa0f0.firebaseapp.com",
 projectId:"molkky-aa0f0",
 storageBucket:"molkky-aa0f0.firebasestorage.app",
 messagingSenderId:"843713016774",
 appId:"1:843713016774:web:99c2148a3be45a439d38c7"
};
const app=initializeApp(firebaseConfig), db=getFirestore(app), auth=getAuth(app);
let user=null, currentCode=localStorage.getItem("molkky_code")||"", unsub=null, data=null, activeScores={};

const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
async function boot(){try{const c=await signInAnonymously(auth);user=c.user}catch(e){$("lobbyMsg").textContent="Firebase Authenticationの匿名ログインを有効にしてください。"} if(currentCode) subscribe(currentCode)}
boot();

async function createTournament(){
 const name=$("newTournamentName").value.trim()||"モルック大会", c=code();
 const initial={name,createdAt:Date.now(),players:[],games:[],activeGame:null};
 await setDoc(doc(db,"tournaments",c),initial); currentCode=c; localStorage.setItem("molkky_code",c); subscribe(c);
}
window.createTournament=createTournament;

function subscribe(c){
 if(unsub)unsub(); $("lobby").classList.add("hidden"); $("tournament").classList.remove("hidden"); $("code").textContent=c;
 unsub=onSnapshot(doc(db,"tournaments",c),snap=>{if(!snap.exists()){alert("大会が見つかりません");return} data=snap.data(); render()});
}
window.joinTournament=async()=>{const c=$("joinCode").value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c)){alert("6文字の大会コードを入力してください");return}const s=await getDoc(doc(db,"tournaments",c));if(!s.exists()){alert("大会が見つかりません");return}currentCode=c;localStorage.setItem("molkky_code",c);subscribe(c)};
window.leaveTournament=()=>{localStorage.removeItem("molkky_code");if(unsub)unsub();location.reload()};

async function addPlayer(){
 const name=$("playerName").value.trim(); if(!name)return;
 if(data.players.some(p=>p.name===name)){alert("同じ名前がいます");return}
 const p={id:crypto.randomUUID(),name,scoreTotal:0,wins:0,losses:0,points:0,maxScore:0,streak:0,bestStreak:0,history:[]};
 await updateDoc(doc(db,"tournaments",currentCode),{players:arrayUnion(p)});
 $("playerName").value="";
}
window.addPlayer=addPlayer;

async function startGame(){
 try{
  if(data.players.length<2){alert("2人以上登録してください");return}
  if(data.activeGame){alert("すでに試合入力中です");return}
  const ids=data.players.map(p=>p.id);
  ids.sort(()=>Math.random()-.5);
  const team1=[], team2=[];
  ids.forEach((id,i)=>(i%2===0?team1:team2).push(id));
  await updateDoc(doc(db,"tournaments",currentCode),{activeGame:{team1,team2,createdAt:Date.now(),scores:{}}});
 }catch(e){showError(e)}
}
async function cancelGame(){try{await updateDoc(doc(db,"tournaments",currentCode),{activeGame:null})}catch(e){showError(e)}}
async function finishGame(){
 const a=data.activeGame;if(!a)return;
 const team1=a.team1||[], team2=a.team2||[];
 for(const id of [...team1,...team2])if(a.scores[id]===undefined){alert("全員の得点を入力してください");return}
 const totals=[team1.reduce((s,id)=>s+(Number(a.scores[id])||0),0),team2.reduce((s,id)=>s+(Number(a.scores[id])||0),0)];
 if(totals[0]===totals[1]){alert("チーム合計が同点です。勝敗を決めてから確定してください。");return}
 const winTeam=totals[0]>totals[1]?0:1, gameNo=data.games.length+1;
 const results=data.players.filter(p=>[...team1,...team2].includes(p.id)).map(p=>({id:p.id,name:p.name,score:Number(a.scores[p.id])||0,team:team1.includes(p.id)?0:1,win:winTeam===(team1.includes(p.id)?0:1)}));
 const game={gameNo,date:new Date().toLocaleString("ja-JP"),teams:{team1,team2},totals,results};
 const players=data.players.map(p=>{
   const r=results.find(x=>x.id===p.id); if(!r)return p;
   const win=r.win; return {...p,scoreTotal:p.scoreTotal+r.score,wins:p.wins+(win?1:0),losses:p.losses+(win?0:1),points:p.points+(win?1:0),maxScore:Math.max(p.maxScore,r.score),streak:win?p.streak+1:0,bestStreak:Math.max(p.bestStreak,win?p.streak+1:0),history:[...(p.history||[]),{game:gameNo,score:r.score,win,points:p.points+(win?1:0)}]};
 });
 await updateDoc(doc(db,"tournaments",currentCode),{players,games:arrayUnion(game),activeGame:null});
}
async function undoLast(){
 if(!data.games.length)return;if(!confirm("最後の試合を取り消しますか？"))return;
 const games=data.games.slice(0,-1), players=data.players.map(p=>({...p,scoreTotal:0,wins:0,losses:0,points:0,maxScore:0,streak:0,bestStreak:0,history:[]}));
 for(const g of games)for(const r of g.results){const p=players.find(x=>x.id===r.id);if(!p)continue;p.scoreTotal+=r.score;p.wins+=r.win?1:0;p.losses+=r.win?0:1;p.points+=r.win?1:0;p.maxScore=Math.max(p.maxScore,r.score);p.streak=r.win?p.streak+1:0;p.bestStreak=Math.max(p.bestStreak,p.streak);p.history.push({game:r.game||g.gameNo,score:r.score,win:r.win,points:p.points})}
 await updateDoc(doc(db,"tournaments",currentCode),{players,games,activeGame:null});
}
window.cancelGame=cancelGame;window.finishGame=finishGame;window.undoLast=undoLast;

async function scoreInput(id,val){activeScores[id]=Number(val)||0;await updateDoc(doc(db,"tournaments",currentCode),{["activeGame.scores."+id]:Number(val)||0})}

function showError(e){
 const el=$("error");
 if(el){el.classList.remove("hidden");el.textContent="Firebaseエラー: "+(e?.message||e);}
 console.error(e);
}
function render(){
 $("title").textContent=data.name||"モルック大会"; $("code").textContent=currentCode;
 $("players").innerHTML=data.players.length?data.players.map(p=>`<span class="chip">${esc(p.name)}</span>`).join(""):"<span class='muted'>まだ参加者がいません</span>";
 renderGame();renderRanking();renderResult();renderHistory();drawChart();
}
function renderGame(){
 const a=data.activeGame, el=$("game");
 if(!a){el.innerHTML=`<div class="notice">2チームに自動振り分けして試合を開始します。</div><button class="primary" style="width:100%;margin-top:10px" onclick="startGame()">▶️ 試合を開始</button>`;return}
 let html='<div class="notice">各個人の得点を入力。<b>チーム合計が高いチーム</b>が勝利し、勝利チーム全員に⭐1ポイント。</div>';
 const activeTeams=[a.team1||[],a.team2||[]];
 activeTeams.forEach((ids,ti)=>{let total=ids.reduce((s,id)=>s+(Number(a.scores[id])||0),0);html+=`<div class="team"><h3>チーム${ti+1}　合計 <b>${total}点</b></h3><div class="grid">`;ids.forEach(id=>{const p=data.players.find(x=>x.id===id);html+=`<label>${esc(p.name)}</label><input type="number" min="0" inputmode="numeric" value="${a.scores[id]??""}" oninput="scoreInput('${id}',this.value)" placeholder="得点">`});html+='</div></div>'});
 html+=`<button class="primary" style="width:100%;margin-top:10px" onclick="finishGame()">🏆 結果を確定</button><button style="width:100%;margin-top:7px" onclick="cancelGame()">入力をキャンセル</button>`;
 el.innerHTML=html;
}
window.scoreInput=scoreInput;window.startGame=startGame;

function rank(){return [...data.players].sort((a,b)=>b.points-a.points||b.wins-a.wins||b.maxScore-a.maxScore)}
function renderRanking(){
 const a=rank(); if(!a.length){$("ranking").innerHTML='<span class="muted">参加者を登録してください。</span>';return}
 $("ranking").innerHTML=`<table class="table"><tr><th>順位・名前</th><th>勝</th><th>敗</th><th>勝率</th><th>⭐</th><th>最高得点</th></tr>`+a.map((p,i)=>`<tr><td><b>${i+1}位</b> ${esc(p.name)} ${i===0&&data.games.length?"👑":""}</td><td>${p.wins}</td><td>${p.losses}</td><td>${((p.wins/(p.wins+p.losses||1))*100).toFixed(0)}%</td><td><b>${p.points}</b></td><td>${p.maxScore}</td></tr>`).join("")+"</table>";
}
function renderResult(){
 if(!data.games.length){$("result").innerHTML='<span class="muted">試合を記録すると表示されます。</span>';return}
 const a=rank(),top=a[0],last=a[a.length-1],mw=Math.max(...a.map(p=>p.wins)),ms=Math.max(...a.map(p=>p.maxScore)),bs=Math.max(...a.map(p=>p.bestStreak));
 $("result").innerHTML=`<div class="center"><div class="muted">現在の優勝者</div><div class="big">🏆 ${esc(top.name)}</div><div>${top.points}ポイント / ${top.wins}勝</div></div><hr>
 <div>👑 <b>最多勝</b>：${a.filter(p=>p.wins===mw).map(p=>esc(p.name)).join("、")}（${mw}勝）</div>
 <div>🎯 <b>最高得点</b>：${a.filter(p=>p.maxScore===ms).map(p=>esc(p.name)).join("、")}（${ms}点）</div>
 <div>🔥 <b>最多連勝</b>：${a.filter(p=>p.bestStreak===bs).map(p=>esc(p.name)).join("、")}（${bs}連勝）</div>
 <div style="margin-top:10px;padding:12px;border-radius:12px;background:#f1f1f1">💩 <b>最下位</b><br><span class="big">${esc(last.name)}</span> さん</div>`;
}
function renderHistory(){
 if(!data.games.length){$("history").innerHTML='<span class="muted">まだ試合がありません。</span>';return}
 $("history").innerHTML=data.games.map(g=>`<div class="history"><b>第${g.gameNo}試合</b>　${esc(g.date)}<br>チーム1：${g.totals[0]}点　vs　チーム2：${g.totals[1]}点 → <b>チーム${g.totals[0]>g.totals[1]?1:2}勝利</b><br>${g.results.slice().sort((a,b)=>b.score-a.score).map((r,i)=>`<span class="badge ${i===0?'gold':''}">${i+1}位 ${esc(r.name)}：${r.score}点 ${r.win?'🏆 +1':''}</span>`).join(" ")}</div>`).join("")+`<button class="danger" onclick="undoLast()">↩️ 最後の試合を取り消す</button>`;
}
function drawChart(){
 const c=$("chart"),ctx=c.getContext("2d"),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);
 if(!data.games.length){ctx.font="14px sans-serif";ctx.fillText("試合を記録すると推移が表示されます。",20,40);return}
 const arr=rank(),left=35,bottom=30,top=15,right=90,max=Math.max(1,...arr.map(p=>p.points));
 ctx.strokeStyle="#bbb";ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,h-bottom);ctx.lineTo(w-right,h-bottom);ctx.stroke();
 arr.slice(0,6).forEach((p,idx)=>{ctx.strokeStyle=["#111","#444","#666","#888","#aaa","#ccc"][idx];ctx.lineWidth=2;ctx.beginPath();(p.history||[]).forEach((x,i)=>{const X=left+(i/Math.max(1,data.games.length-1))*(w-left-right),Y=h-bottom-(x.points/max)*(h-bottom-top);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();ctx.fillStyle="#111";ctx.font="12px sans-serif";ctx.fillText(p.name,w-82,22+idx*17)});
}
</script>
</body>
</html>
